name: Build S23 APK from ZIP

on:
  push:
    branches: [main, master]
    paths:
      - S23_QuickTranslate_App.zip
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect ZIP archive
        id: package
        shell: bash
        run: |
          if [ -f S23_QuickTranslate_App.zip ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo '::error::ZIP 파일이 없습니다. 저장소 최상위에 S23_QuickTranslate_App.zip을 업로드하세요.'
            exit 1
          fi

      - name: Extract uploaded ZIP safely
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          python3 - <<'PYEXTRACT'
          import pathlib, stat, zipfile
          root = pathlib.Path('source').resolve()
          root.mkdir(exist_ok=True)
          with zipfile.ZipFile('S23_QuickTranslate_App.zip') as archive:
              for member in archive.infolist():
                  name = pathlib.PurePosixPath(member.filename)
                  mode = (member.external_attr >> 16)
                  if name.is_absolute() or '..' in name.parts or chr(92) in member.filename or stat.S_ISLNK(mode):
                      raise SystemExit(f'Unsafe ZIP entry: {member.filename}')
                  path = (root / member.filename).resolve()
                  if not path.is_relative_to(root):
                      raise SystemExit(f'ZIP path traversal: {member.filename}')
              archive.extractall(root)
          if not (root / 'settings.gradle.kts').is_file():
              raise SystemExit('settings.gradle.kts missing: ZIP must contain the app files at its top level')
          if not (root / 'app' / 'build.gradle.kts').is_file():
              raise SystemExit('app/build.gradle.kts missing')
          print('ZIP extracted. Android project found.')
          PYEXTRACT

      - name: Set up Java 17
        if: steps.package.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Gradle 8.13
        if: steps.package.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        if: steps.package.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build debug APK
        if: steps.package.outputs.present == 'true'
        working-directory: source
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        if: steps.package.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S23QuickTranslate-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
